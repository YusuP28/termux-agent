name: Build Termux Agent

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Download healthy Gradle wrapper
        run: |
          curl -fsSL -o android/gradlew \
            "https://raw.githubusercontent.com/gradle/gradle/v8.13/gradlew"
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.13/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew

      - name: Build Release APK
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-agent-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
